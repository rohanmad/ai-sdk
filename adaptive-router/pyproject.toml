[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptive-router"
version = "0.1.0"
description = "Adaptive inference router SDK — routes requests across local and cloud LLMs"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pyyaml>=6.0",
]

[project.optional-dependencies]
local = ["llama-cpp-python>=0.2.0"]
cloud = ["openai>=1.0.0"]
ml = ["scikit-learn>=1.3.0", "pandas>=2.0.0", "sentence-transformers>=2.0.0", "joblib>=1.3.0"]
dev = ["pytest>=7.0.0"]
all = ["adaptive-router[local,cloud,ml,dev]"]

[project.scripts]
adaptive-router = "scripts.demo:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["packages*", "telemetry*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
